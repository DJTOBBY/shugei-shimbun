subtitle":null,"lead":"2023年秋ごろから広がった編み物ブームが、2026年8月も勢いを失っていない。前号までに既報の売り上げ水準に、大きな変化は見られないという。","category":"市場・ビジネス","tags":["市場","編み物","毛糸"],"publishedAt":"2026-08-04T08:00:00+09:00"},{"issueDate":"2026-08-04","issueLabel":"試作第7号","id":"business-001","articleType":"BUSINESS","title":"ヴィンテージ素材を仕入れるという選択","subtitle":null,"lead":"ジャパンヴィンテージビーズが2026年のジュエリートレンドとして注目される中、ハンドメイド作家にとって個体差のある素材をどう仕入れ、作品に生かすかを考えてみた。","category":"作家・クリエイター","tags":["作家ビジネス","ヴィンテージ素材"],"publishedAt":"2026-08-04T11:00:00+09:00"},{"issueDate":"2026-08-04","issueLabel":"試作第7号","id":"culture-001","articleType":"CULTURE","title":"ジャパンヴィンテージビーズ・とんぼ玉、その土地の技術が生んだ造形","subtitle":null,"lead":"本紙2面の特集で触れたジャパンヴィンテージビーズやとんぼ玉は、それぞれの土地の技術と時代の蓄積が育んできた工芸でもある。","category":"文化・歴史","tags":["文化","ビーズ","とんぼ玉"],"publishedAt":"2026-08-04T11:15:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"front-lead-jcraft","articleType":"NEWS","title":"ジャパンクラフトHD、営業利益61.5％増","subtitle":"クラフトハートトーカイ運営、2026年6月期は最終黒字に転換","lead":"手芸専門店「クラフトハートトーカイ」を展開するジャパンクラフトホールディングスが8月10日、2026年6月期決算を発表した。売上高は約140億円で前年並みだったが、営業利益は1億600万円と前期比61.5％増加した。","category":"総合","tags":["企業","決算","クラフトハートトーカイ","手芸小売"],"publishedAt":"2026-08-16T07:00:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"col-chief-editor-001","articleType":"CHIEF_EDITOR","title":"サイトが閉じる日に","subtitle":"編集長コラム「手芸の向こう側」第7回","lead":"8月31日をもって、ひとつの手芸サイトが閉じます。閉じるのは店舗ではなく、読者が作品や工夫を持ち寄っていた「窓口」のほうです。","category":"コラム","tags":["編集長コラム","パンドラハウス","記録"],"publishedAt":"2026-08-16T10:00:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"editorial-001","articleType":"EDITORIAL","title":"営業利益61.5％増を、どう読むか","subtitle":"編集部はこう見る","lead":"ジャパンクラフトホールディングスの2026年6月期決算は、売上横ばいのまま営業利益が61.5％増え、最終利益は黒字に転じた。増益と黒字転換は、実は別の要因で生じている。","category":"論説","tags":["論説","決算","手芸小売","編み物"],"publishedAt":"2026-08-16T10:15:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"feature-001","articleType":"FEATURE","title":"陰翳、モヘヤ、カシミヤ——2026-27秋冬、毛糸各社の打ち出しが出そろう","subtitle":"今週の特集","lead":"7月から8月にかけて、主要毛糸メーカーの2026-27秋冬コレクションの輪郭が相次いで公開された。今年の打ち出しを並べると、各社が「色」ではなく「質感」で語ろうとしていることが見えてくる。","category":"特集","tags":["特集","毛糸","秋冬コレクション","編み物"],"publishedAt":"2026-08-16T10:30:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"market-001","articleType":"MARKET","title":"手芸小売、閉じる窓口と開く店舗","subtitle":null,"lead":"パンドラハウスの公式サイト閉鎖と、ユザワヤの新店開業・既存店閉店が同じ月に重なった。撤退でも拡大でもない、置き場所の組み替えが進んでいる。","category":"市場・ビジネス","tags":["市場","手芸小売","ユザワヤ","パンドラハウス"],"publishedAt":"2026-08-16T08:00:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"market-002","articleType":"NEWS","title":"minne、海外からの作品購入に対応","subtitle":null,"lead":"GMOペパボが運営するハンドメイドマーケット「minne」が、越境ECサービスの活用により海外から作品を購入できる仕組みを整えたと公式noteで案内している。","category":"市場・ビジネス","tags":["市場","minne","越境EC","販路"],"publishedAt":"2026-08-16T08:30:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"business-001","articleType":"BUSINESS","title":"発表の場が消えるとき、作家は記録をどこに置くか","subtitle":null,"lead":"パンドラハウスの公式サイト閉鎖では、利用者の投稿コンテンツも非公開・削除となる。作品の記録を他社のサービスに預けている作家にとって、他人事ではない。","category":"作家・クリエイター","tags":["作家ビジネス","アーカイブ","プラットフォーム"],"publishedAt":"2026-08-16T11:00:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"culture-001","articleType":"CULTURE","title":"「SASHIKO」という世界語","subtitle":null,"lead":"刺し子は、いつの間にか翻訳されない言葉になった。海外では「SASHIKO」の名で親しまれ、オランダ発のデニムブランドがその技法でリメイクデニムを作っている。","category":"文化・歴史","tags":["文化","刺し子","海外","デニム"],"publishedAt":"2026-08-16T11:15:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"col-chief-editor-002","articleType":"CHIEF_EDITOR","title":"「上手な作品」と「心に残る作品」は、少し違う","subtitle":"編集長コラム","lead":"「上手な作品とは、いったい何だろう」。技術的には完璧なのに記憶に残らない作品があり、少し不揃いなところがあっても何年経っても思い出す作品があります。その違いはどこにあるのでしょうか。","category":"コラム","tags":["編集長コラム","手芸文化論","個性","作家ビジネス"],"publishedAt":"2026-08-16T11:30:00+09:00"},{"issueDate":"2026-08-16","issueLabel":"試作第8号","id":"col-chief-editor-003","articleType":"CHIEF_EDITOR","title":"手芸は、完成品ではなく「文化」を作っている","subtitle":"編集長コラム","lead":"手芸を考えるとき、私たちはつい「完成したもの」に目を向けがちです。しかし手芸の本当の価値は、人から人へ伝わる「知恵の連鎖」にあるのではないでしょうか。","category":"コラム","tags":["編集長コラム","手芸文化論","技法の継承","記録"],"publishedAt":"2026-08-16T11:45:00+09:00"}];

  function issueUrl(a) {
    return 'issues/' + a.issueDate + '.html?goto=' + encodeURIComponent(a.id);
  }

  function formatDate(issueDate) {
    const [y, m, d] = issueDate.split('-');
    return y + '年' + parseInt(m, 10) + '月' + parseInt(d, 10) + '日';
  }

  const typeLabel = {
    NEWS: 'NEWS', CHIEF_EDITOR: 'コラム', EDITORIAL: '論説', FEATURE: '特集',
    MARKET: '市場', BUSINESS: '作家・ビジネス', CULTURE: '文化',
  };

  /* ===== 編集長コラム 連載一覧 ===== */
  function renderColumnSeries() {
    const columns = articles
      .filter((a) => a.articleType === 'CHIEF_EDITOR')
      .sort((a, b) => a.publishedAt.localeCompare(b.publishedAt));
    const list = document.getElementById('column-list');
    list.innerHTML = columns.map((a) => {
      const seriesMatch = (a.subtitle || '').match(/第(\d+)回/);
      const noLabel = seriesMatch ? '連載 第' + seriesMatch[1] + '回' : '号外コラム';
      return (
        '<li><a class="col-item" href="' + issueUrl(a) + '">' +
        '<div class="col-no">' + noLabel + '</div>' +
        '<div class="col-title">' + a.title + '</div>' +
        '<div class="col-meta">' + formatDate(a.issueDate) + '（' + a.issueLabel + '）</div>' +
        '</a></li>'
      );
    }).join('');
  }

  /* ===== 記事検索 ===== */
  const allTags = Array.from(new Set(articles.flatMap((a) => a.tags))).sort();
  let activeTag = null;

  function renderTagFilters() {
    const box = document.getElementById('tag-filters');
    box.innerHTML = allTags.map((t) =>
      '<button type="button" class="tag-chip" data-tag="' + t + '">' + t + '</button>'
    ).join('');
    box.querySelectorAll('.tag-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeTag = activeTag === btn.dataset.tag ? null : btn.dataset.tag;
        renderTagFilters();
        renderResults();
      });
      if (btn.dataset.tag === activeTag) btn.classList.add('active');
    });
  }

  function renderResults() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const filtered = articles.filter((a) => {
      const matchesTag = !activeTag || a.tags.includes(activeTag);
      if (!matchesTag) return false;
      if (!q) return true;
      const haystack = [a.title, a.lead, a.category, a.subtitle, ...a.tags].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    }).sort((a, b) => b.issueDate.localeCompare(a.issueDate));

    const list = document.getElementById('result-list');
    if (filtered.length === 0) {
      document.getElementById('result-count').textContent = '該当する記事が見つかりませんでした。';
      list.innerHTML = '';
      return;
    }
    document.getElementById('result-count').textContent = filtered.length + '件の記事';
    list.innerHTML = filtered.map((a) => (
      '<li><a class="result-item" href="' + issueUrl(a) + '">' +
      '<div class="result-top"><span class="r-badge">' + (typeLabel[a.articleType] || a.articleType) + '</span>' +
      '<span>' + formatDate(a.issueDate) + '（' + a.issueLabel + '）</span>' +
      '<span>' + a.category + '</span></div>' +
      '<div class="result-title">' + a.title + '</div>' +
      '<div class="result-lead">' + (a.lead || '') + '</div>' +
      '</a></li>'
    )).join('');
  }

  document.getElementById('search-input').addEventListener('input', renderResults);

  renderColumnSeries();
  renderTagFilters();
  renderResults();
</script>
